        <title>Sign In</title>

    <body>
        <div class="Signin">
            <label for="uname">
                <b>Username</b>
            </label>

            <input type="text" placeholder="Enter Username" name="uname" required>

            <label for="psw">
                <b>Password</b>

                Login
            </button>
        </div>
    </body>
</html>
