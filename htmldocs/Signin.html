<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sign In</title>
        <style>
            html {
                background-color: #0d1b2a;
                font-family: Tahoma, sans-serif;
                text-align: center;
            }
            .signin {
                display: flex;
                align-items: center;
                justify-content: center;
            }

        </style>
    </head>

    <body>
        <div class="Signin">
            <label for="uname">
                <b>Username</b>
            </label>

            <input type="text" placeholder="Enter Username" name="uname" required>

            <label for="psw">
                <b>Password</b>
            </label>
            
            <input type="password" placeholder="Enter Password" name="psw" required>

            <button type="submit">
                Login
            </button>
        </div>
    </body>
</html>
